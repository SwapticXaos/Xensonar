name: XenSonar release checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['n21-f2/**', '.github/workflows/consolidation.yml']
  push:
    branches: ['main', 'codex/**']
    paths: ['n21-f2/**', '.github/workflows/consolidation.yml']
permissions:
  contents: read
concurrency:
  group: xensonar-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: n21-f2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: n21-f2/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:consolidation
        id: checks
      - uses: actions/upload-artifact@v4
        if: always() && steps.checks.outcome != 'skipped'
        with:
          name: host-validation
          path: n21-f2/results/architecture-stability/
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: n21-f2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: n21-f2/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Select installed browser
        run: node -e 'console.log("XEN_CHROMIUM_PATH="+require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"
      - run: npm run test:consolidation:browser
        id: checks
      - uses: actions/upload-artifact@v4
        if: always() && steps.checks.outcome != 'skipped'
        with:
          name: chromium-validation
          path: n21-f2/results/architecture-stability/
